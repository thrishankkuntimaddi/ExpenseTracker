<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Expense Tracker — Liquid Glass app icon (master; scripts/render-icons.mjs renders every size).
       A clear glass tile (colourless, lit from the top-left) and one crisp wallet glyph in the
       app's money green — the same mark as the "Money in" tile. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F4F6F8"/>
      <stop offset="1" stop-color="#E3E7EC"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.2" cy="0.04" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx="0.8" cy="1.08" r="0.75">
      <stop offset="0" stop-color="#9AA4B2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9AA4B2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="3" x2="0" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DD26B"/>
      <stop offset="1" stop-color="#16903F"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="18" result="b"/>
      <feFlood flood-color="#0E5A2B" flood-opacity="0.28"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <g id="bg" clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#glass)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <rect width="1024" height="1024" fill="url(#depth)"/>
    <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="url(#rim)" stroke-width="12"/>
  </g>

  <g id="glyph">
    <!-- wallet (24-unit grid, centred on 512,512) -->
    <g filter="url(#lift)">
      <g transform="translate(212 212) scale(25)" fill="none" stroke="url(#green)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
        <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
      </g>
    </g>
    <!-- a glass light catch along the top of the strokes -->
    <g transform="translate(212 212) scale(25)" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.5" stroke-linecap="round">
      <path d="M5.2 2.6H18"/>
      <path d="M2.6 5.2v6"/>
    </g>
  </g>
</svg>
