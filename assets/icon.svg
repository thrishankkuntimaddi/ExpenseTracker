<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Expense Tracker — Liquid Glass app icon (master; scripts/render-icons.mjs renders every size).
       Layers: a luminous green field · a frosted glass card · a glass ₹ coin that refracts the card. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4BE08F"/>
      <stop offset="0.5" stop-color="#16A862"/>
      <stop offset="1" stop-color="#067147"/>
    </linearGradient>
    <radialGradient id="fieldLight" cx="0.22" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fieldShade" cx="0.85" cy="1.05" r="0.7">
      <stop offset="0" stop-color="#003B26" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#003B26" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="coinFill" cx="0.34" cy="0.26" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="26" result="b"/>
      <feFlood flood-color="#00331F" flood-opacity="0.38"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lens" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
    <clipPath id="coinClip"><circle cx="640" cy="626" r="196"/></clipPath>
    <g id="card">
      <rect x="196" y="262" width="500" height="320" rx="64"/>
    </g>
  </defs>

  <g id="bg" clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#field)"/>
    <rect width="1024" height="1024" fill="url(#fieldLight)"/>
    <rect width="1024" height="1024" fill="url(#fieldShade)"/>
  </g>

  <g id="glyph">
    <!-- back layer: a frosted glass card -->
    <g transform="rotate(-9 446 422)" filter="url(#drop)">
      <use href="#card" fill="url(#glassFill)" stroke="url(#rim)" stroke-width="6"/>
      <rect x="199" y="336" width="494" height="58" fill="#FFFFFF" fill-opacity="0.34"/>
      <rect x="252" y="452" width="164" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.82"/>
      <rect x="252" y="500" width="98" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.5"/>
      <path d="M 262 280 H 630" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
    </g>

    <!-- front layer: a glass coin; the card bends and blurs through it -->
    <g filter="url(#drop)">
      <circle cx="640" cy="626" r="196" fill="#0B8A55" fill-opacity="0.18"/>
    </g>
    <g clip-path="url(#coinClip)">
      <g transform="translate(-22 -14) scale(1.04) rotate(-9 446 422)" filter="url(#lens)">
        <use href="#card" fill="#FFFFFF" fill-opacity="0.5"/>
        <rect x="199" y="336" width="494" height="58" fill="#FFFFFF" fill-opacity="0.4"/>
      </g>
    </g>
    <circle cx="640" cy="626" r="196" fill="url(#coinFill)" stroke="url(#rim)" stroke-width="7"/>
    <circle cx="640" cy="626" r="158" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3"/>
    <!-- specular light catch along the top-left edge -->
    <path d="M 478 560 A 178 178 0 0 1 640 448" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="9" stroke-linecap="round" filter="url(#soft)"/>
    <!-- ₹ -->
    <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 572 536 H 712"/>
      <path d="M 572 592 H 712"/>
      <path d="M 612 536 C 704 536 708 648 582 648 L 702 752"/>
    </g>
  </g>
</svg>
