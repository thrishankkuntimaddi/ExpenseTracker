name: Deploy web app

on:
  push:
    branches: [main]
    # Docs-only changes don't redeploy (each deploy also ships an Android update)
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Repository variables/secrets are exported only when they are set, so an
      # unset one can never override a value coming from a committed .env file.
      - name: Load Firebase config from repository variables (if set)
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ vars.VITE_APPCHECK_SITE_KEY }}
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_MEASUREMENT_ID VITE_APPCHECK_SITE_KEY VITE_GOOGLE_DESKTOP_CLIENT_ID VITE_GOOGLE_DESKTOP_CLIENT_SECRET VITE_FIREBASE_VAPID_KEY VITE_GOOGLE_WEB_CLIENT_ID; do
            value="${!name}"
            if [ -n "$value" ]; then echo "$name=$value" >> "$GITHUB_ENV"; fi
          done

      - name: Verify Firebase configuration is present
        run: node scripts/check-config.mjs

      # The web app: served from the root of its own site (Firebase Hosting)
      - name: Build
        env:
          APP_BASE: /
          VITE_APP_URL: ${{ vars.APP_URL }}
        run: npm run build

      # Over-the-air update for the Android app, published next to the website
      - name: Build Android over-the-air bundle
        run: |
          npm run build:native
          node scripts/make-ota.mjs

      # The latest release's installers + desktop update files, served from the
      # site too — some networks crawl on github's release file host
      - name: Mirror the latest release on the website
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mirror-release.mjs dist/app

      # GitHub Pages: the product page + app update files (dist-pages/)
      - name: Assemble the product page
        run: node scripts/build-pages.mjs

      # The web app → Firebase Hosting. Needs the FIREBASE_SERVICE_ACCOUNT
      # secret with the "Firebase Hosting Admin" role (README → Hosting).
      - name: Deploy the web app to Firebase Hosting
        if: github.event_name != 'pull_request'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT not set — skipping the app deploy"; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15.31.0 deploy --only hosting \
            --project "${{ vars.VITE_FIREBASE_PROJECT_ID || 'expensetracker-385b0' }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist-pages'

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
