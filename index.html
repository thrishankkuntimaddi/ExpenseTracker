<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicon — all browsers ── -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32x32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16x16.png?v=4" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=4" sizes="any" />
    <!-- Shortcut icon for legacy -->
    <link rel="shortcut icon" href="%BASE_URL%favicon-32x32.png?v=4" />

    <!-- ── Apple / PWA icons ── -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=4" />
    <link rel="apple-touch-icon" sizes="512x512" href="%BASE_URL%icon-512.png?v=4" />
    <link rel="manifest" href="%BASE_URL%manifest.json?v=4" />

    <!-- ── Viewport & Theme ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6366F1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Expense Tracker" />

    <!-- ── SEO ── -->
    <meta name="description" content="Personal Expense Tracker – smart month-based financial tracking with carry-forward balance, wastage awareness, income management, and visual analytics." />
    <meta name="keywords" content="expense tracker, personal finance, budget, savings, income" />

    <title>Expense Tracker – Personal Finance</title>

    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Preloader keyframe -->
    <style>
      @keyframes preloaderSlide {
        from { transform: translateX(-8px); }
        to   { transform: translateX(8px); }
      }
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        transition: opacity 0.25s ease;
      }
    </style>
  </head>
  <body style="background:#F5F3FF;margin:0">
    <!-- Theme applied before React boots — prevents FOUC -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('et_theme');
          if (!t) {
            var s = localStorage.getItem('expense_tracker_v1') || localStorage.getItem('expenseTrackerState');
            var parsed = s && JSON.parse(s);
            t = parsed && parsed.settings && parsed.settings.theme;
          }
          t = t || 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.body.style.backgroundColor = t === 'monoflow' ? '#0c0c0c' : '#F8FAFC';
        } catch(e) {}
      })();
    </script>

    <!-- Preloader: OUTSIDE #root so React's createRoot() doesn't wipe it -->
    <div id="app-preloader">
      <img src="%BASE_URL%Expense.png" alt="Expense Tracker Logo" style="
        width:52px; height:52px; border-radius:14px;
        object-fit:cover;
        box-shadow:0 8px 24px rgba(99,102,241,0.35);
      " />
      <div style="
        width:36px; height:4px; border-radius:99px;
        background:rgba(99,102,241,0.15); overflow:hidden;
      ">
        <div style="
          width:60%; height:100%; border-radius:99px;
          background:#6366F1;
          animation:preloaderSlide 1.2s ease-in-out infinite alternate;
        "></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // Use hostname-only check — port can be '' in installed PWA mode on production.
        var isDev = (
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1'
        );
        if (isDev) {
          // Dev mode: unregister any cached SW so it can't
          // intercept Vite's HMR requests and cause blank screens.
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) {
              r.unregister();
              console.log('[SW] Unregistered dev SW:', r.scope);
            });
          });
        } else {
          // Production: register SW and auto-reload when a new one activates.
          // This prevents blank screens caused by stale JS/CSS asset references.
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/ExpenseTracker/sw.js')
              .then(function(reg) {
                console.log('[SW] Registered, scope:', reg.scope);

                // When a new SW takes over, reload to get fresh assets.
                var refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', function() {
                  if (!refreshing) {
                    refreshing = true;
                    console.log('[SW] New SW active — reloading for fresh assets.');
                    window.location.reload();
                  }
                });

                // Tell a waiting SW to skip waiting immediately.
                if (reg.waiting) {
                  reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                }
                reg.addEventListener('updatefound', function() {
                  var newWorker = reg.installing;
                  if (newWorker) {
                    newWorker.addEventListener('statechange', function() {
                      if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        // New SW installed; tell it to activate now.
                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                      }
                    });
                  }
                });
              })
              .catch(function(e) { console.warn('[SW] Registration failed:', e); });
          });
        }
      }
    </script>
  </body>
</html>
